<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Contact Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f3e9;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-6 lg:p-8">

    <div class="w-full max-w-xl bg-white rounded-xl shadow-2xl p-6 sm:p-8 lg:p-10">
        <h1 class="text-3xl sm:text-4xl font-bold text-center text-gray-800 mb-6 sm:mb-8">Contact Us</h1>
        <p class="text-center text-gray-600 mb-8 sm:mb-10">We'd love to hear from you! Please fill out the form below and we'll get back to you as soon as possible.</p>

        <!-- The form with built-in HTML5 validation -->
        <form id="workingContactForm" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
                    placeholder="John Doe"
                >
            </div>
            <div>
                <!-- THIS IS THE KEY PART: type="email" and required attribute -->
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
                    placeholder="john.doe@example.com"
                >
            </div>
            <div>
                <label for="message" class="block text-sm font-medium text-gray-700 mb-2">Message</label>
                <textarea
                    id="message"
                    name="message"
                    rows="4"
                    required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500"
                    placeholder="Your message here..."
                ></textarea>
            </div>
            <div id="statusMessage" class="hidden text-center p-3 rounded-lg text-sm font-medium"></div>
            <div>
                <button
                    type="submit"
                    class="w-full flex justify-center items-center px-6 py-3 border border-transparent text-base font-bold rounded-lg shadow-sm text-white bg-yellow-600 hover:bg-yellow-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500 transition duration-150 ease-in-out"
                >
                    Send Message
                </button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('workingContactForm');
        const statusMessage = document.getElementById('statusMessage');

        // Listen for the form submission event
        form.addEventListener('submit', function(event) {
            // Check if the form is valid according to HTML5 validation rules
            if (!form.checkValidity()) {
                // If invalid, the browser will show the error message.
                // We just prevent the default submission here.
                event.preventDefault();
                console.log("Form is invalid. Browser will show error messages.");
            } else {
                // If the form is valid, prevent default submission for this demo
                event.preventDefault();
                console.log("Form is valid. Submitting...");

                // Display a success message
                statusMessage.textContent = 'Message sent successfully!';
                statusMessage.className = 'block text-center p-3 rounded-lg text-sm font-medium bg-green-100 text-green-700 transition-opacity';
                
                // Clear the form fields
                form.reset();
            }
        });
    </script>
</body>
</html>
